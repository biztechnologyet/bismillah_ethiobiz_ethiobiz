server {
    listen 80;
    listen [::]:80;
    server_name ethiobiz.et;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ethiobiz.et;

    ssl_certificate     /etc/letsencrypt/live/ethiobiz.et/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ethiobiz.et/privkey.pem;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";

    resolver 127.0.0.11 valid=30s;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }
    location / {
    proxy_read_timeout 3600s;
    proxy_connect_timeout 3600s;
    proxy_send_timeout 3600s;
        # P4-B H1: speak HTTP/1.1 upstream so the frontend gzip (>=1.1 only)
        # actually fires; HTTP/1.0 default silently disabled all compression.
        proxy_http_version 1.1;
        set $upstream_frontend http://bismallah_ethiobiz_inshaallah-frontend-1:8080;
        proxy_pass $upstream_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
