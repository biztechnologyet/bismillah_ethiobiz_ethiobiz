<style>
    :root {
        --afocha-teal: #008080;
        --afocha-teal-dark: #093a3e;
        --afocha-gold: #f59e0b;
        --afocha-blue: #0284c7;
        --afocha-border: #e2e8f0;
    }
    .afocha-feed-container {
        max-width: 820px;
        margin: 0 auto;
        padding: 20px 15px 50px 15px;
    }
    .afocha-hero {
        background: linear-gradient(135deg, #093a3e 0%, #008080 50%, #0284c7 100%);
        color: white;
        padding: 35px 24px;
        border-radius: 24px;
        margin-bottom: 28px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,128,128,0.22);
    }
    .afocha-composer-card {
        background: #ffffff;
        border: 1px solid var(--afocha-border);
        border-radius: 20px;
        padding: 22px;
        margin-bottom: 25px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    }
    .composer-tab-btn {
        padding: 6px 14px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
        background: #f8fafc;
        color: #475569;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s;
    }
    .composer-tab-btn.active {
        background: #008080;
        color: white;
        border-color: #008080;
    }
    .post-card {
        background: #ffffff;
        border: 1px solid var(--afocha-border);
        border-radius: 20px;
        padding: 22px;
        margin-bottom: 20px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.03);
        transition: all 0.2s ease;
    }
    .post-card:hover {
        border-color: #cbd5e1;
        box-shadow: 0 8px 25px rgba(0,0,0,0.06);
    }
    .post-avatar {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: linear-gradient(135deg, #008080 0%, #0284c7 100%);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 18px;
    }
    .poll-box {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px;
        margin: 14px 0;
    }
    .poll-opt-btn {
        width: 100%;
        text-align: left;
        position: relative;
        overflow: hidden;
        border: 1px solid #cbd5e1;
        background: #ffffff;
        border-radius: 12px;
        padding: 10px 16px;
        margin-bottom: 8px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    .poll-opt-btn:hover {
        border-color: #008080;
        background: #f0fdfa;
    }
    .poll-progress-fill {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        background: rgba(0, 128, 128, 0.18);
        z-index: 1;
        transition: width 0.4s ease;
    }
    .poll-opt-content {
        position: relative;
        z-index: 2;
        display: flex;
        justify-content: space-between;
    }
    .comment-item {
        background: #f8fafc;
        border-radius: 14px;
        padding: 12px 16px;
        margin-bottom: 10px;
        font-size: 13px;
    }
    .fullpage-post-wrapper {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        padding: 30px;
        box-shadow: 0 10px 35px rgba(0,0,0,0.06);
        margin-bottom: 30px;
    }
</style>

<div class="afocha-feed-container">
    <!-- Single Post View Container (Loaded via ?post=AFO-...) -->
    <div id="afocha-single-post-view" style="display: none;">
        <!-- Dynamically injected -->
    </div>

    <!-- Main Feed View -->
    <div id="afocha-main-feed-view">
        <!-- HERO BANNER -->
        <div class="afocha-hero">
            <span class="badge bg-warning text-dark px-3 py-1 rounded-pill font-weight-bold mb-2">🌟 AFOCHA SOCIAL PULSE</span>
            <h2 class="font-weight-bold mb-1">Ethiopia's Verified Business & Community Network</h2>
            <p class="mb-0 text-white-50 small">Share insights, launch polls, discover verified enterprises, and engage in real time.</p>
        </div>

        <!-- RICH MEDIA COMPOSER -->
        <div class="afocha-composer-card">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="font-weight-bold text-dark font-size-14">✨ Create Story or Poll</span>
                <div class="d-flex gap-2">
                    <button class="composer-tab-btn active" data-tab="text">✍️ Story</button>
                    <button class="composer-tab-btn" data-tab="media">🖼️ Media</button>
                    <button class="composer-tab-btn" data-tab="poll">📊 Poll</button>
                </div>
            </div>

            <div class="row g-2 mb-2">
                <div class="col-md-6">
                    <input type="text" id="post-author-name" class="form-control form-control-sm rounded-pill px-3" placeholder="Your Name or Business Name *">
                </div>
                <div class="col-md-3">
                    <input type="text" id="post-author-handle" class="form-control form-control-sm rounded-pill px-3" placeholder="@username" value="@ethiobiz">
                </div>
                <div class="col-md-3">
                    <select id="post-category" class="form-select form-select-sm rounded-pill px-3">
                        <option value="Business & Trade">💼 Business & Trade</option>
                        <option value="Tech & Innovation">🚀 Tech & Innovation</option>
                        <option value="Food & Dining">☕ Food & Dining</option>
                        <option value="Real Estate & Living">🏠 Real Estate</option>
                        <option value="Jobs & Career">🎯 Jobs & Career</option>
                        <option value="Community & Events">🌟 Community</option>
                    </select>
                </div>
            </div>

            <textarea id="post-content" class="form-control mb-3" rows="3" placeholder="What's happening in your business or community today?..." style="border-radius: 14px;"></textarea>

            <!-- Media Inputs (Hidden by default) -->
            <div id="composer-media-section" class="mb-3" style="display: none; background: #f8fafc; padding: 12px; border-radius: 12px; border: 1px dashed #cbd5e1;">
                <input type="text" id="post-image-url" class="form-control form-control-sm rounded-pill mb-2" placeholder="Image URL (e.g. https://... or /files/image.jpg)">
                <input type="text" id="post-video-url" class="form-control form-control-sm rounded-pill" placeholder="YouTube or MP4 Video URL">
            </div>

            <!-- Poll Inputs (Hidden by default) -->
            <div id="composer-poll-section" class="mb-3" style="display: none; background: #f8fafc; padding: 14px; border-radius: 12px; border: 1px dashed #cbd5e1;">
                <label class="font-weight-bold text-dark small mb-1">📊 Community Poll Question:</label>
                <input type="text" id="poll-question-input" class="form-control form-control-sm rounded-pill mb-2" placeholder="Ask a question (e.g. Which Ethiopian coffee roast is your favorite?)">
                <div id="poll-options-container">
                    <input type="text" class="form-control form-control-sm rounded-pill mb-1 poll-opt-val" placeholder="Option 1">
                    <input type="text" class="form-control form-control-sm rounded-pill mb-1 poll-opt-val" placeholder="Option 2">
                </div>
                <button type="button" id="btn-add-poll-opt" class="btn btn-xs btn-outline-secondary rounded-pill mt-1" style="font-size: 11px;">+ Add Option</button>
            </div>

            <div class="d-flex justify-content-between align-items-center">
                <small class="text-muted">Instant publishing across EthioBiz network</small>
                <button id="btn-submit-post" class="btn btn-sm btn-primary px-4 rounded-pill font-weight-bold" style="background: #008080; border: none;">
                    Publish Post &rarr;
                </button>
            </div>
        </div>

        <!-- POSTS FEED STREAM -->
        <div id="afocha-feed-stream">
            <div class="text-center py-4"><div class="spinner-border spinner-border-sm text-primary"></div><span class="ms-2">Loading stories...</span></div>
        </div>
    </div>
</div>

<script>
(function() {
    let activeComposerTab = "text";

    // Tab switching
    document.querySelectorAll('.composer-tab-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.composer-tab-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            activeComposerTab = this.getAttribute('data-tab');

            document.getElementById('composer-media-section').style.display = (activeComposerTab === 'media') ? 'block' : 'none';
            document.getElementById('composer-poll-section').style.display = (activeComposerTab === 'poll') ? 'block' : 'none';
        });
    });

    // Add poll option button
    const btnAddPollOpt = document.getElementById('btn-add-poll-opt');
    if (btnAddPollOpt) {
        btnAddPollOpt.addEventListener('click', function() {
            const container = document.getElementById('poll-options-container');
            const count = container.querySelectorAll('.poll-opt-val').length;
            if (count < 4) {
                const inp = document.createElement('input');
                inp.type = 'text';
                inp.className = 'form-control form-control-sm rounded-pill mb-1 poll-opt-val';
                inp.placeholder = 'Option ' + (count + 1);
                container.appendChild(inp);
            }
        });
    }

    // Submit post
    document.getElementById('btn-submit-post').addEventListener('click', function() {
        const author = document.getElementById('post-author-name').value.trim();
        const handle = document.getElementById('post-author-handle').value.trim() || '@ethiobiz';
        const category = document.getElementById('post-category').value;
        const content = document.getElementById('post-content').value.trim();
        const image = document.getElementById('post-image-url').value.trim();
        const video = document.getElementById('post-video-url').value.trim();

        if (!author || !content) {
            alert('Please enter your name and post story.');
            return;
        }

        let isPoll = 0;
        let pollQ = null;
        let pollOpts = null;

        if (activeComposerTab === 'poll') {
            pollQ = document.getElementById('poll-question-input').value.trim();
            const optInputs = document.querySelectorAll('.poll-opt-val');
            const opts = [];
            optInputs.forEach(i => { if (i.value.trim()) opts.push(i.value.trim()); });
            if (pollQ && opts.length >= 2) {
                isPoll = 1;
                pollOpts = JSON.stringify(opts);
            }
        }

        const btn = this;
        btn.disabled = true;
        btn.innerText = 'Publishing...';

        fetch('/api/method/bismillah_ethiobiz.afocha_api.create_social_post', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
                author_name: author,
                author_handle: handle,
                category_tag: category,
                content: content,
                post_image: image,
                video_url: video,
                is_poll: isPoll,
                poll_question: pollQ || '',
                poll_options: pollOpts || ''
            })
        })
        .then(r => r.json())
        .then(res => {
            btn.disabled = false;
            btn.innerText = 'Publish Post →';
            document.getElementById('post-content').value = '';
            loadFeed();
        })
        .catch(e => {
            btn.disabled = false;
            btn.innerText = 'Publish Post →';
            console.error(e);
        });
    });

    // Check URL for ?post=AFO-...
    const urlParams = new URLSearchParams(window.location.search);
    const singlePostId = urlParams.get('post');

    if (singlePostId) {
        loadSinglePost(singlePostId);
    } else {
        loadFeed();
    }

    function loadFeed() {
        document.getElementById('afocha-main-feed-view').style.display = 'block';
        document.getElementById('afocha-single-post-view').style.display = 'none';

        fetch('/api/method/bismillah_ethiobiz.afocha_api.get_social_feed')
            .then(r => r.json())
            .then(res => {
                const stream = document.getElementById('afocha-feed-stream');
                stream.innerHTML = '';
                const posts = (res.message && res.message.posts) ? res.message.posts : [];

                if (!posts.length) {
                    stream.innerHTML = '<div class="text-center py-5 text-muted bg-white rounded-4 border p-4">No stories yet. Be the first to publish!</div>';
                    return;
                }

                posts.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'post-card';
                    card.id = 'post-node-' + p.name;

                    let mediaHtml = '';
                    if (p.post_image) {
                        mediaHtml += `<div class="mb-3"><img src="${p.post_image}" style="max-height: 400px; width: 100%; object-fit: cover; border-radius: 14px;"></div>`;
                    }
                    if (p.video_url) {
                        mediaHtml += `<div class="mb-3"><iframe src="${p.video_url}" style="width: 100%; height: 320px; border-radius: 14px; border: none;"></iframe></div>`;
                    }

                    let pollHtml = '';
                    if (p.is_poll && p.poll_data) {
                        pollHtml = renderPollWidget(p.name, p.poll_data);
                    }

                    card.innerHTML = `
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="d-flex align-items-center gap-3">
                                <div class="post-avatar">${p.author_name ? p.author_name.charAt(0) : 'E'}</div>
                                <div>
                                    <div class="d-flex align-items-center gap-1">
                                        <h6 class="mb-0 font-weight-bold text-dark">${p.author_name}</h6>
                                        ${p.is_verified ? '<span title="Verified" style="color: #008080;">✓</span>' : ''}
                                    </div>
                                    <small class="text-muted">${p.author_handle} • ${p.post_date.split(' ')[0]}</small>
                                </div>
                            </div>
                            <span class="badge bg-light text-dark px-2 py-1 rounded-pill" style="border: 1px solid #e2e8f0; font-size: 11px;">${p.category_tag}</span>
                        </div>

                        <p style="color: #334155; line-height: 1.6; font-size: 15px; margin-bottom: 14px;">${p.content}</p>

                        ${mediaHtml}
                        ${pollHtml}

                        <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                            <div class="d-flex gap-3">
                                <button class="btn btn-xs btn-outline-secondary rounded-pill px-3 py-1 btn-like-post" data-id="${p.name}">
                                    ❤️ <span class="like-cnt">${p.likes_count}</span>
                                </button>
                                <a href="/social?post=${p.name}" class="btn btn-xs btn-outline-secondary rounded-pill px-3 py-1">
                                    💬 <span>${p.comments_count} Comments</span>
                                </a>
                            </div>
                            <button class="btn btn-xs btn-outline-dark rounded-pill px-3 py-1 btn-share-post" data-id="${p.name}" data-url="https://ethiobiz.et/social?post=${p.name}">
                                🔗 Share
                            </button>
                        </div>
                    `;
                    stream.appendChild(card);
                });

                bindFeedEvents();
            });
    }

    function renderPollWidget(postId, pollData) {
        let optsHtml = '';
        pollData.options.forEach(opt => {
            optsHtml += `
                <div class="poll-opt-btn" data-post="${postId}" data-opt="${opt.index}">
                    <div class="poll-progress-fill" style="width: ${opt.percentage}%;"></div>
                    <div class="poll-opt-content">
                        <span>${opt.text}</span>
                        <span><b>${opt.percentage}%</b> (${opt.votes})</span>
                    </div>
                </div>
            `;
        });

        return `
            <div class="poll-box" id="poll-box-${postId}">
                <div class="font-weight-bold text-dark mb-2" style="font-size: 14px;">📊 ${pollData.question || 'Community Poll'}</div>
                ${optsHtml}
                <div class="text-muted small mt-1">Total votes: ${pollData.total_votes}</div>
            </div>
        `;
    }

    function bindFeedEvents() {
        // Like buttons
        document.querySelectorAll('.btn-like-post').forEach(b => {
            b.addEventListener('click', function() {
                const pid = this.getAttribute('data-id');
                const cntSpan = this.querySelector('.like-cnt');
                fetch('/api/method/bismillah_ethiobiz.afocha_api.like_social_post?post_id=' + pid)
                    .then(r => r.json())
                    .then(res => {
                        if (res.message) cntSpan.innerText = res.message.likes_count;
                    });
            });
        });

        // Poll voting
        document.querySelectorAll('.poll-opt-btn').forEach(b => {
            b.addEventListener('click', function() {
                const pid = this.getAttribute('data-post');
                const optIdx = this.getAttribute('data-opt');
                fetch('/api/method/bismillah_ethiobiz.afocha_api.vote_poll?post_id=' + pid + '&option_index=' + optIdx)
                    .then(r => r.json())
                    .then(res => {
                        if (res.message && res.message.poll_data) {
                            const container = document.getElementById('poll-box-' + pid);
                            if (container) {
                                container.outerHTML = renderPollWidget(pid, res.message.poll_data);
                                bindFeedEvents();
                            }
                        }
                    });
            });
        });

        // Share buttons
        document.querySelectorAll('.btn-share-post').forEach(b => {
            b.addEventListener('click', function() {
                const url = this.getAttribute('data-url');
                if (navigator.share) {
                    navigator.share({ title: 'EthioBiz AFOCHA Story', url: url });
                } else {
                    navigator.clipboard.writeText(url);
                    alert('Post permalink copied to clipboard: ' + url);
                }
            });
        });
    }

    function loadSinglePost(postId) {
        document.getElementById('afocha-main-feed-view').style.display = 'none';
        const singleView = document.getElementById('afocha-single-post-view');
        singleView.style.display = 'block';
        singleView.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div><span class="ms-2">Loading full story...</span></div>';

        fetch('/api/method/bismillah_ethiobiz.afocha_api.get_social_feed?post_id=' + encodeURIComponent(postId))
            .then(r => r.json())
            .then(res => {
                if (!res.message || !res.message.post) {
                    singleView.innerHTML = '<div class="text-center py-5">Post not found. <a href="/social">Return to feed</a></div>';
                    return;
                }

                const p = res.message.post;
                const comments = res.message.comments || [];

                let mediaHtml = '';
                if (p.post_image) {
                    mediaHtml += `<div class="mb-3"><img src="${p.post_image}" style="max-height: 480px; width: 100%; object-fit: cover; border-radius: 16px;"></div>`;
                }
                if (p.video_url) {
                    mediaHtml += `<div class="mb-3"><iframe src="${p.video_url}" style="width: 100%; height: 380px; border-radius: 16px; border: none;"></iframe></div>`;
                }

                let pollHtml = '';
                if (p.is_poll && p.poll_data) {
                    pollHtml = renderPollWidget(p.name, p.poll_data);
                }

                let commentsListHtml = '';
                comments.forEach(c => {
                    commentsListHtml += `
                        <div class="comment-item">
                            <div class="d-flex justify-content-between mb-1">
                                <span class="font-weight-bold text-dark">${c.author_name}</span>
                                <small class="text-muted">${c.comment_date.split(' ')[0]}</small>
                            </div>
                            <div style="color: #334155;">${c.comment_text}</div>
                        </div>
                    `;
                });

                singleView.innerHTML = `
                    <div class="mb-3">
                        <a href="/social" class="btn btn-sm btn-outline-dark rounded-pill px-3 py-1 font-weight-bold">&larr; Back to Community Feed</a>
                    </div>
                    <div class="fullpage-post-wrapper">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="d-flex align-items-center gap-3">
                                <div class="post-avatar" style="width: 56px; height: 56px; font-size: 22px;">${p.author_name ? p.author_name.charAt(0) : 'E'}</div>
                                <div>
                                    <div class="d-flex align-items-center gap-1">
                                        <h5 class="mb-0 font-weight-bold text-dark">${p.author_name}</h5>
                                        ${p.is_verified ? '<span title="Verified" style="color: #008080;">✓</span>' : ''}
                                    </div>
                                    <small class="text-muted">${p.author_handle} • ${p.post_date}</small>
                                </div>
                            </div>
                            <span class="badge bg-light text-dark px-3 py-2 rounded-pill font-size-13" style="border: 1px solid #e2e8f0;">${p.category_tag}</span>
                        </div>

                        <div style="font-size: 17px; color: #1e293b; line-height: 1.7; margin-bottom: 20px;">
                            ${p.content}
                        </div>

                        ${mediaHtml}
                        ${pollHtml}

                        <div class="d-flex justify-content-between align-items-center pt-3 border-top mb-4">
                            <div class="d-flex gap-3">
                                <button class="btn btn-sm btn-outline-secondary rounded-pill px-3 py-1 btn-like-post" data-id="${p.name}">
                                    ❤️ <span class="like-cnt">${p.likes_count}</span>
                                </button>
                                <span class="btn btn-sm btn-light rounded-pill px-3 py-1">
                                    💬 <span>${p.comments_count} Comments</span>
                                </span>
                            </div>
                            <button class="btn btn-sm btn-outline-dark rounded-pill px-3 py-1 btn-share-post" data-url="https://ethiobiz.et/social?post=${p.name}">
                                🔗 Share Post
                            </button>
                        </div>

                        <!-- COMMENTS SECTION -->
                        <div class="comments-section mt-4 pt-3 border-top">
                            <h6 class="font-weight-bold text-dark mb-3">💬 Comments & Discussion (${comments.length})</h6>
                            
                            <!-- Comment Input Form -->
                            <div class="bg-light p-3 rounded-4 mb-4 border">
                                <div class="row g-2 mb-2">
                                    <div class="col-md-6">
                                        <input type="text" id="cmt-author-name" class="form-control form-control-sm rounded-pill" placeholder="Your Name *">
                                    </div>
                                    <div class="col-md-6">
                                        <input type="text" id="cmt-author-handle" class="form-control form-control-sm rounded-pill" placeholder="@handle" value="@community">
                                    </div>
                                </div>
                                <textarea id="cmt-text" class="form-control mb-2" rows="2" placeholder="Write your comment..." style="border-radius: 12px;"></textarea>
                                <div class="text-end">
                                    <button id="btn-submit-comment" class="btn btn-sm btn-primary rounded-pill px-4" style="background: #008080; border: none;">
                                        Post Comment
                                    </button>
                                </div>
                            </div>

                            <div id="comments-list-stream">
                                ${commentsListHtml || '<div class="text-muted small py-3">No comments yet. Share your thoughts!</div>'}
                            </div>
                        </div>
                    </div>
                `;

                bindFeedEvents();

                // Submit comment action
                const btnCmt = document.getElementById('btn-submit-comment');
                if (btnCmt) {
                    btnCmt.addEventListener('click', function() {
                        const name = document.getElementById('cmt-author-name').value.trim();
                        const handle = document.getElementById('cmt-author-handle').value.trim();
                        const text = document.getElementById('cmt-text').value.trim();

                        if (!name || !text) {
                            alert('Please enter your name and comment text.');
                            return;
                        }

                        btnCmt.disabled = true;
                        fetch('/api/method/bismillah_ethiobiz.afocha_api.add_post_comment', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: new URLSearchParams({
                                post_id: p.name,
                                author_name: name,
                                author_handle: handle,
                                comment_text: text
                            })
                        })
                        .then(r => r.json())
                        .then(res => {
                            btnCmt.disabled = false;
                            loadSinglePost(p.name);
                        })
                        .catch(e => {
                            btnCmt.disabled = false;
                            console.error(e);
                        });
                    });
                }
            });
    }
})();
</script>
