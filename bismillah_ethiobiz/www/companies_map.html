{% extends "templates/web.html" %}

{% block title %}EthioBiz Business & Products Map — Full Screen Discovery{% endblock %}

{% block header %}
<!-- Leaflet CSS & JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
    /* Full Page Edge-to-Edge Map Layout */
    body, html {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
    }
    .page-container {
        padding: 0 !important;
        max-width: 100% !important;
        margin: 0 !important;
    }
    .container {
        max-width: 100% !important;
        padding: 0 !important;
    }
    #map-fullscreen-wrapper {
        position: relative;
        width: 100vw;
        height: calc(100vh - 65px);
        min-height: 550px;
    }
    #map-container {
        width: 100%;
        height: 100%;
        z-index: 1;
    }
    /* Floating Map Controls & Filters Over Map */
    .map-floating-panel {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding: 10px 18px;
        border-radius: 35px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
        border: 1px solid rgba(255, 255, 255, 0.7);
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        max-width: 92vw;
    }
    .map-chip {
        padding: 6px 14px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
        background: #f8fafc;
        color: #334155;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        white-space: nowrap;
    }
    .map-chip.active, .map-chip:hover {
        background: #008080;
        color: #ffffff;
        border-color: #008080;
    }
    .btn-gps-nearme {
        background: linear-gradient(135deg, #0f766e 0%, #008080 100%);
        color: white !important;
        border: none;
        padding: 7px 16px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 5px;
        box-shadow: 0 2px 10px rgba(0,128,128,0.3);
    }
    .map-search-input {
        height: 34px;
        border-radius: 18px;
        border: 1px solid #cbd5e1;
        padding: 0 14px;
        font-size: 12px;
        width: 160px;
    }
    .map-search-input:focus {
        outline: none;
        border-color: #008080;
    }
    .company-popup-card {
        max-width: 280px;
        padding: 6px;
        font-family: inherit;
    }
    .company-popup-card h5 {
        margin: 0 0 4px 0;
        font-size: 16px;
        color: #0f172a;
        font-weight: 700;
    }
    .company-popup-badge {
        display: inline-block;
        background: #e0f2fe;
        color: #0369a1;
        font-size: 11px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 10px;
        margin-bottom: 6px;
    }
    .company-popup-address {
        font-size: 12px;
        color: #64748b;
        margin-bottom: 8px;
        line-height: 1.4;
    }
    .company-popup-btn {
        display: block;
        background: #008080;
        color: #ffffff !important;
        text-align: center;
        padding: 7px 12px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 700;
        text-decoration: none;
        margin-top: 8px;
        transition: background 0.2s ease;
    }
    .company-popup-btn:hover {
        background: #0f766e;
    }
    .map-stat-badge {
        position: absolute;
        bottom: 25px;
        left: 25px;
        z-index: 1000;
        background: rgba(15, 23, 42, 0.85);
        color: white;
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        backdrop-filter: blur(8px);
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
</style>
{% endblock %}

{% block page_content %}
<div id="map-fullscreen-wrapper">
    <!-- Floating On-Map Filter & Search Bar -->
    <div class="map-floating-panel">
        <input type="text" id="map-quick-search" class="map-search-input" placeholder="Search business / area...">
        <div class="d-flex gap-1" id="map-chips">
            <button class="map-chip active" data-cat="">All (Ethiopia)</button>
            <button class="map-chip" data-cat="Hotel & Lodging">🏨 Hotels</button>
            <button class="map-chip" data-cat="Restaurant & Cafe">🍽️ Restaurants</button>
            <button class="map-chip" data-cat="Retail & Supermarket">🛒 Retail</button>
            <button class="map-chip" data-cat="Salon & Beauty">✂️ Salons</button>
            <button class="map-chip" data-cat="Clinic & Healthcare">🏥 Healthcare</button>
            <button class="map-chip" data-cat="Real Estate & Property">🏢 Real Estate</button>
        </div>
        <button class="btn-gps-nearme" id="btn-map-nearme">
            <span>📍</span> Near Me
        </button>
    </div>

    <!-- Live Counter Floating Badge -->
    <div class="map-stat-badge" id="map-stat-count">
        📍 <span>Loading verified locations...</span>
    </div>

    <!-- Fullscreen Map Canvas -->
    <div id="map-container"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const defaultCenter = [9.0108, 38.7617];
    const map = L.map('map-container', { zoomControl: false }).setView(defaultCenter, 12);

    // Add zoom controls to bottom-right
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // OpenStreetMap tile layer
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors | EthioBiz.et',
        maxZoom: 19
    }).addTo(map);

    let markers = [];
    let allCompanies = [];
    let currentCategory = "";

    function renderMarkers(companies) {
        markers.forEach(m => map.removeLayer(m));
        markers = [];

        if (!companies || companies.length === 0) {
            document.getElementById('map-stat-count').innerHTML = `📍 0 locations in this category`;
            return;
        }

        document.getElementById('map-stat-count').innerHTML = `📍 <b>${companies.length}</b> verified locations active in Ethiopia`;

        companies.forEach(comp => {
            const marker = L.marker([comp.lat, comp.lng]).addTo(map);
            const popupContent = `
                <div class="company-popup-card">
                    <h5>${comp.name}</h5>
                    <span class="company-popup-badge">${comp.category}</span>
                    ${comp.address ? `<div class="company-popup-address">📍 ${comp.address}</div>` : ''}
                    ${comp.phone ? `<div class="company-popup-address">📞 ${comp.phone}</div>` : ''}
                    <a href="${comp.shop_url}" class="company-popup-btn">View Store & Services &rarr;</a>
                </div>
            `;
            marker.bindPopup(popupContent);
            markers.push(marker);
        });
    }

    function loadCompanies(cat) {
        let url = '/api/method/bismillah_ethiobiz.company_map_api.get_company_locations';
        if (cat) {
            url += '?category=' + encodeURIComponent(cat);
        }

        fetch(url)
            .then(res => res.json())
            .then(res => {
                allCompanies = res.message ? res.message.companies : [];
                renderMarkers(allCompanies);
            })
            .catch(err => console.error(err));
    }

    // Category chips
    document.querySelectorAll('.map-chip').forEach(chip => {
        chip.addEventListener('click', function() {
            document.querySelectorAll('.map-chip').forEach(c => c.classList.remove('active'));
            this.classList.add('active');
            currentCategory = this.getAttribute('data-cat');
            loadCompanies(currentCategory);
        });
    });

    // Quick Search filter
    document.getElementById('map-quick-search').addEventListener('input', function() {
        const q = this.value.toLowerCase().trim();
        if (!q) {
            renderMarkers(allCompanies);
            return;
        }
        const filtered = allCompanies.filter(c => 
            c.name.toLowerCase().includes(q) || 
            (c.address && c.address.toLowerCase().includes(q)) ||
            (c.category && c.category.toLowerCase().includes(q))
        );
        renderMarkers(filtered);
    });

    // "Near Me" GPS Live Pin
    document.getElementById('btn-map-nearme').addEventListener('click', function() {
        if (!navigator.geolocation) {
            alert('Geolocation is not supported by your browser.');
            return;
        }

        navigator.geolocation.getCurrentPosition(function(pos) {
            const userLat = pos.coords.latitude;
            const userLng = pos.coords.longitude;

            map.flyTo([userLat, userLng], 15, { animate: true, duration: 1.5 });

            const userMarker = L.circleMarker([userLat, userLng], {
                radius: 10,
                fillColor: '#008080',
                color: '#ffffff',
                weight: 3,
                opacity: 1,
                fillOpacity: 0.95
            }).addTo(map);

            userMarker.bindPopup('<b>📍 Your Current Location</b>').openPopup();
        }, function(err) {
            alert('Unable to retrieve location. Please allow location access.');
        });
    });

    loadCompanies("");
});
</script>
{% endblock %}
