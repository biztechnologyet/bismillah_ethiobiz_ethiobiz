{% extends "templates/web.html" %}

{% block title %}Interactive Business & Company Map Directory | EthioBiz.ET{% endblock %}

{% block page_content %}
<!-- BISMALLAH ETHIOBIZ FULL-SCREEN GOOGLE MAPS-STYLE DIRECTORY -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<link rel="stylesheet" href="/assets/bismillah_ethiobiz/css/ethiobiz_map.css?v=2.2.0" />

<div class="map-portal-wrapper">
    <!-- COLLAPSIBLE SIDEBAR -->
    <aside id="map-sidebar" class="map-sidebar">
        <!-- TOP SEARCH & HEADER -->
        <div class="sidebar-header">
            <div class="sidebar-search-box">
                <input type="text" id="map-search-input" placeholder="Search businesses, clinics, hotels..." autocomplete="off" />
                <button id="btn-sidebar-search" class="btn-search-icon">🔍</button>
            </div>

            <!-- CATEGORY CHIPS SCROLLER -->
            <div class="sidebar-cat-chips">
                <button class="map-cat-chip active" data-cat="all">🌟 All</button>
                <button class="map-cat-chip" data-cat="shops">🏪 Shops</button>
                <button class="map-cat-chip" data-cat="healthcare">🩺 Clinics</button>
                <button class="map-cat-chip" data-cat="hotels">🏨 Hotels</button>
                <button class="map-cat-chip" data-cat="services">💇 Salons & Spa</button>
                <button class="map-cat-chip" data-cat="restaurants">🍽️ Dining</button>
            </div>

            <!-- RADIUS SLIDER / NEAR ME BAR -->
            <div class="sidebar-geo-bar">
                <button id="btn-map-near-me" class="btn-geo-action">📍 Near Me</button>
                <div class="radius-control">
                    <label>Radius: <span id="radius-val">5</span> km</label>
                    <input type="range" id="radius-slider" min="1" max="25" value="5" />
                </div>
            </div>
        </div>

        <!-- SEARCH RESULTS FEED -->
        <div id="map-results-feed" class="sidebar-feed">
            <div class="feed-status-bar">
                <span id="map-feed-count">Discovering verified businesses...</span>
            </div>
            <div id="map-company-list" class="company-card-list">
                <!-- Dynamically populated company cards -->
            </div>
        </div>

        <!-- DEEP COMPANY DOSSIER DRAWER (Slide-over when company clicked) -->
        <div id="map-dossier-panel" class="dossier-panel" style="display:none;">
            <button id="btn-close-dossier" class="btn-back-dossier">← Back to List</button>
            <div id="dossier-content" class="dossier-content"></div>
        </div>
    </aside>

    <!-- FULLSCREEN LEAFLET CANVAS -->
    <main class="map-canvas-container">
        <div id="ethiobiz-fullscreen-map" class="map-canvas"></div>
    </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="/assets/bismillah_ethiobiz/js/ethiobiz_map.js?v=2.2.0"></script>
{% endblock %}
