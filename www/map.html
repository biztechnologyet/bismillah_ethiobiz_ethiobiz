{% extends "templates/web.html" %}

{% block title %}Interactive Business & Company Map Directory | EthioBiz.ET{% endblock %}

{% block page_content %}
<!-- BISMALLAH ETHIOBIZ FULL-SCREEN GOOGLE MAPS-STYLE DIRECTORY -->
<link rel="stylesheet" href="/assets/bismillah_ethiobiz/css/leaflet.css?v=1.9.4" />
<link rel="stylesheet" href="/assets/bismillah_ethiobiz/css/MarkerCluster.css?v=1.5.3" />
<link rel="stylesheet" href="/assets/bismillah_ethiobiz/css/MarkerCluster.Default.css?v=1.5.3" />
<link rel="stylesheet" href="/assets/bismillah_ethiobiz/css/ethiobiz_map.css?v=2.5.0" />

<div class="map-portal-wrapper" id="map-portal-wrapper">
    <!-- COLLAPSIBLE / PINNABLE SIDEBAR -->
    <aside id="map-sidebar" class="map-sidebar">
        <!-- TOP SEARCH & HEADER -->
        <div class="sidebar-header">
            <div class="sidebar-top-row" style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
                <div class="sidebar-search-box" style="flex: 1; margin-bottom: 0;">
                    <input type="text" id="map-search-input" placeholder="Search businesses, clinics, hotels..." autocomplete="off" />
                    <button id="btn-sidebar-search" class="btn-search-icon" aria-label="Search">🔍</button>
                </div>
                <button id="btn-pin-map-sidebar" class="btn-pin-map-sidebar" title="Pin / Dock Sidebar" aria-label="Pin Sidebar">
                    📌
                </button>
                <button id="btn-toggle-map-sidebar" class="btn-collapse-map-sidebar" title="Collapse Sidebar" aria-label="Collapse Sidebar">
                    ◀
                </button>
            </div>

            <!-- CATEGORY CHIPS SCROLLER -->
            <div class="sidebar-cat-chips">
                <button class="map-cat-chip active" data-cat="all">🌟 All</button>
                <button class="map-cat-chip" data-cat="shops">🏪 Shops</button>
                <button class="map-cat-chip" data-cat="healthcare">🩺 Clinics</button>
                <button class="map-cat-chip" data-cat="hotels">🏨 Hotels</button>
                <button class="map-cat-chip" data-cat="services">💇 Salons & Spa</button>
                <button class="map-cat-chip" data-cat="restaurants">🍽️ Dining</button>
            </div>

            <!-- RADIUS SLIDER / NEAR ME BAR -->
            <div class="sidebar-geo-bar">
                <button id="btn-map-near-me" class="btn-geo-action">📍 Near Me</button>
                <div class="radius-control">
                    <label>Radius: <span id="radius-val">5</span> km</label>
                    <input type="range" id="radius-slider" min="1" max="25" value="5" />
                </div>
            </div>
        </div>

        <!-- SEARCH RESULTS FEED -->
        <div id="map-results-feed" class="sidebar-feed">
            <div class="feed-status-bar">
                <span id="map-feed-count">Discovering verified businesses...</span>
            </div>
            <div id="map-company-list" class="company-card-list">
                <!-- Dynamically populated company cards -->
            </div>
        </div>

        <!-- DEEP COMPANY DOSSIER DRAWER (Slide-over when company clicked) -->
        <div id="map-dossier-panel" class="dossier-panel" style="display:none;">
            <button id="btn-close-dossier" class="btn-back-dossier">← Back to List</button>
            <div id="dossier-content" class="dossier-content"></div>
        </div>
    </aside>

    <!-- FLOATING EXPAND BUTTON (Visible when sidebar collapsed) -->
    <button id="btn-floating-expand-sidebar" class="btn-floating-map-expand" style="display:none;">
        ▶ Search Businesses
    </button>

    <!-- FULLSCREEN LEAFLET CANVAS -->
    <main class="map-canvas-container">
        <!-- FLOATING INTERACTIVE MAP CONTROLS (TASK-2026-00845) -->
        <div class="map-floating-tools">
            <button id="btn-map-fit-bounds" class="map-tool-btn" title="Fit All Locations">
                🗺️ Fit All
            </button>
            <button id="btn-map-locate-fab" class="map-tool-btn btn-locate-fab" title="Find My Location">
                🎯 Locate Me
            </button>
        </div>
        <div id="ethiobiz-fullscreen-map" class="map-canvas"></div>
    </main>
</div>

<script src="/assets/bismillah_ethiobiz/js/leaflet.js?v=1.9.4"></script>
<script src="/assets/bismillah_ethiobiz/js/leaflet.markercluster.js?v=1.5.3"></script>
<script src="/assets/bismillah_ethiobiz/js/ethiobiz_map.js?v=2.5.0"></script>
{% endblock %}
